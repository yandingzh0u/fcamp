# FPO++ (Flow Policy Optimization++) on the G1 crawl task.
#
# SINGLE-STEP actor-critic, matching the official amazon-far/fpo-control robot structure:
# PPO single-step rollout + single-step flow actor + CFM ratio + ASPO. One flow-generated action
# per env step (horizon == 1 -> chunk_dim == action_dim == 29). There is NO
# action chunk, no terminal_penalty death shaping; deaths/timeouts use the validated PPO per-step
# mechanics (timeout value bootstrap + done truncation in GAE, gamma=0.99 NOT gamma^H).
#
# Paper-faithful hyperparameters (arXiv:2602.02481, motion-tracking Table A.2):
#   flow_steps=50, fpo_num_mc=16, lr=3e-4, weight_decay=1e-4, clip_range=0.01,
#   gamma=0.99, gae_lambda=0.95, num_learning_epochs=5, num_mini_batches=4,
#   AdamW betas=(0.9,0.95) (set in code), running observation normalization on.
#
# CFM ratio scale: the CFM loss is the MEAN squared error over the action dim (see cfm_loss in
# algorithms/fpo_pp.py), not the raw sum, so exp(l_old - l_new) stays O(1).
#
# Memory note: the rollout stores a per-sample noise buffer of shape
#   (num_steps_per_env, num_envs, fpo_num_mc, action_dim).
# With these defaults (24 steps * 8192 envs * 16 mc * 29 dims) that is ~365 MB on the rollout
# device. If you OOM, lower num_envs, fpo_num_mc, or num_steps_per_env.
#
# Single source of defaults. Override any leaf with --set a.b=c.

algo_name: fpo_pp

env:
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  fix_root_link: false
  startup_randomization: true
  motion_file: ""          # "" resolves to the packaged crawl motion
  max_episode_steps: 500   # official 10s @ 50Hz; aligned across PPO/FPO/MixGRPO
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  # adaptive phase sampling (Holosoma causal-lookback, owned by env.step): a tracking failure
  # at frame f only feeds START frames in [f - lookback_max, f - lookback_min] (roll-in before
  # the wall). p(s) = hard_ratio * failure-lookback + uniform_ratio * uniform.
  adaptive_motion_sampling: true
  adaptive_hard_ratio: 0.7
  adaptive_uniform_ratio: 0.3
  adaptive_lookback_min: 20
  adaptive_lookback_max: 80
  adaptive_alpha: 0.001
  # reward: official Holosoma WBT 9-term reward. action_rate is the only tunable weight.
  action_rate_weight: 0.1

algo:
  # network: single-step Flow actor (horizon=1 -> chunk_dim == action_dim). NO tanh squash;
  # action = actor_scale * x_t. Velocity net input = [obs, embed(t) (timestep_embed_dim), x_t].
  action_dim: 29
  horizon: 1
  actor_hidden_dims: [1024, 512, 256]
  activation: elu
  action_squash_scale: 5.0     # unused by the official Flow actor (kept for config compatibility)
  actor_scale: 1.0             # action = actor_scale * x_t (official, linear). MUST stay 1.0: CFM uses
                               # scaled_action = action/actor_scale, so actor_scale<1 inflates the
                               # effective action_perturb_std (0.1/scale) in the CFM target and
                               # pollutes the ratio/KL/CFM-loss scale -- it is NOT a harmless gain.
  mlp_output_scale: 1.0        # scale on the raw velocity-net output (official)
  timestep_embed_dim: 8        # sinusoidal cos/sin timestep embedding width (official)
  cfm_loss_reduction: mean     # reduction over the action dim (official G1 tracking)
  action_perturb_std: 0.1      # Gaussian noise added to the action in training (official tracking)
  cfm_loss_t_inverse_cdf_beta: 1.0
  num_generations: 1           # FPO++ has no GRPO groups
  # flow integration
  flow_steps: 16               # Euler steps generating one action (official default 64; 16 is a
                               # compute/quality compromise -- 4 is too coarse, 64 makes collect ~16x
                               # slower for this single-step actor)
  init_noise_std: 1.0          # informational; Euler uses standard N(0, I) noise
  eval_initial_noise: zero
  # rollout
  num_steps_per_env: 24        # rollout horizon per update (NOT an episode cap -- envs run
                               # continuously across updates with critic bootstrap at the boundary).
                               # 24 halves collect/update cost & CFM cache vs the official 48; 8192
                               # envs still give plenty of terminations. Official G1 tracking = 48.
  discount_gamma: 0.99
  # terminal_penalty: 0.0 = OFFICIAL RL logic. The FPO collect does NOT inject any extra death
  # penalty into the reward; env dense reward enters storage as-is, timeout does value bootstrap,
  # and a failure `done` only truncates GAE. PPO/MixGRPO already prove the env reward+termination
  # is learnable, so FPO must not modify the MDP reward. (>0 re-enables the -penalty*failure
  # injection in collect(); left configurable but off by default.)
  terminal_penalty: 0.0
  # FPO++ objective (official G1 motion-tracking values)
  fpo_num_mc: 16               # Monte-Carlo (eps, t) samples per action (Eq. 10)
  fpo_delta_clip: 3.0          # STE clamp on log-ratio (l_old - l_new) before exp() (cfm_diff_clamp_max)
  fpo_cfm_loss_clamp: 3.0      # symmetric clamp on old/new CFM loss (cfm_loss_clamp)
  cfm_loss_clamp_neg_adv: true # clamp new CFM loss where advantage < 0
  cfm_loss_clamp_neg_adv_max: 20.0
  fpo_adv_clamp: 5.0           # symmetric advantage clamp before the surrogate
  clip_range: 0.01             # ASPO/PPO clip epsilon (official tracking)
  trust_region_mode: aspo
  # actor-critic optimization
  schedule: adaptive           # KL-driven adaptive learning rate
  desired_kl: 1.0e-4           # target flow-endpoint KL drift (official)
  num_learning_epochs: 5       # passes over each rollout batch. Official G1 tracking = 16 (max
                               # sample reuse); 5 trades reuse for ~3x cheaper updates. 1 = no reuse.
  num_mini_batches: 6          # official tracking; logical minibatches per epoch (one optimizer.step each)
  num_micro_batches: 8         # gradient-accum microbatches per logical minibatch; 8 keeps the
                               # update CFM forward within 16GB at num_envs=8192 (lower to 1 for 2048)
  gae_lambda: 0.95
  value_loss_coef: 1.0
  policy_lr: 1.0e-4            # initial ACTOR LR (adaptive schedule moves it)
  value_lr: 1.0e-3            # fixed CRITIC LR, decoupled from the actor (clipped separately too)
  weight_decay: 1.0e-4
  max_grad_norm: 1.0
  empirical_normalization: true
  init_at_random_ep_len: true
  storage_action_noise_std: 0.0

train:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 100
  checkpoint_dir: ""
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 0
  validation_max_steps: 500
  validation_start_phase: 0
  # directional eval from deep in the clip (hard stand-up segment); set <0 to disable
  validation_directional_start_phase: 800
  validation_fixed_seed: -1
  validation_preserve_state: true
  validation_observation_noise: false
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
  success_checkpoint_name: success_10s.pt
  debug_probe: false
  debug_probe_every: 1
