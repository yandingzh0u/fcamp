algorithm: fpo
environment:
  task: largebox_plane
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
parameters:
  horizon: 1
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  flow_steps: 4
  actor_scale: 1.0
  mlp_output_scale: 1.0
  timestep_embed_dim: 8
  cfm_loss_reduction: mean
  action_perturb_std: 0.1
  cfm_loss_t_inverse_cdf_beta: 1.0
  discount_gamma: 0.99
  num_steps_per_env: 24
  fpo_num_mc: 16
  fpo_delta_clip: 0.0
  fpo_cfm_loss_clamp: 0.0
  cfm_loss_clamp_neg_adv: false
  cfm_loss_clamp_neg_adv_max: 20.0
  fpo_adv_clamp: 5.0
  clip_range: 0.01
  value_clip_range: 0.2
  use_clipped_value_loss: false
  schedule: fixed
  desired_kl: 0.0001
  num_learning_epochs: 5
  num_mini_batches: 4
  num_micro_batches: 8
  gae_lambda: 0.95
  value_loss_coef: 1.0
  policy_lr: 0.0001
  value_lr: 0.001
  weight_decay: 0.0001
  critic_weight_decay: 0.0
  max_grad_norm: 1.0
  empirical_normalization: true
  init_at_random_ep_len: true
  average_losses_before_exp: true
training:
  seed: 0
  max_updates: 1000
  log_every: 10
  save_every: 100
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 100
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: -1
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
