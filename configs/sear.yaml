algorithm: sear
environment:
  task: largebox_plane
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
parameters:
  horizon: 4
  actor_hidden_dim: 512
  actor_num_blocks: 1
  critic_hidden_dim: 512
  critic_num_heads: 16
  critic_num_blocks: 2
  num_value_bins: 101
  value_min: -100.0
  value_max: 1000.0
  action_scale: 1.0
  rollout_env_steps: 24
  discount_gamma: 0.99
  target_tau: 0.05
  replay_capacity: 1000000
  replay_batch_size: 8192
  gradient_steps_per_update: 6
  init_alpha: 0.1
  target_entropy_scale: 1.0
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  weight_decay: 0.0001
  empirical_normalization: true
  init_at_random_ep_len: true
  max_grad_norm: 1.0
training:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 100
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 100
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: -1
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
