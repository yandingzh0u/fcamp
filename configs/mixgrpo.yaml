algorithm: mixgrpo
environment:
  task: largebox_plane
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
parameters:
  horizon: 12
  actor_hidden_dims: [512, 256, 128]
  activation: elu
  action_squash_scale: 5.0
  flow_steps: 4
  sde_eta: 0.7
  init_noise_std: 0.8
  init_same_noise: false
  first_generation_zero_noise: false
  eval_initial_noise: zero
  num_generations: 4
  rollout_env_steps: 48
  tail_bootstrap_steps: 80
  terminal_penalty: 50.0
  discount_gamma: 0.99
  clip_range: 0.3
  adv_clip_max: 5.0
  desired_kl: 0.06
  entropy_coef: 0.005
  policy_epochs: 5
  num_mini_batches: 4
  micro_batch_size: 8192
  max_grad_norm: 1.0
  policy_lr: 0.001
training:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 500
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 0
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: -1
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
