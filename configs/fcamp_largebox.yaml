method: fcamp
environment:
  platform_profile: g1_largebox_50hz
  task: largebox_plane
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  reset_phase_sampling: adaptive
  rsi_keyframe_count: 21
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
  # Environment-owned normalized PD-command domain.  The policy no longer
  # installs either this bound or the carried-rate dynamics after first reset.
  policy_action_bound: 5.0
  # Per-joint target-rate support in normalized action / second, ordered exactly
  # as G1_29DOF_ACTION_NAMES.  These bounds cover the full 50 Hz reference after
  # inverse filtering through the decoder, with 50% support margin.
  command_rate_limit:
    [80.0, 32.5, 66.5, 192.0, 69.0, 43.5,
     84.0, 24.5, 22.5, 210.5, 115.5, 35.0,
     14.0, 25.5, 28.0,
     50.5, 45.0, 14.5, 68.0, 13.0, 155.0, 124.5,
     26.0, 33.0, 61.0, 55.5, 4.5, 112.0, 98.5]
  rate_half_life_seconds: 0.08
  motion_reference_mode: frame
  root_velocity_mode: com

parameters:
  # Causal Flow-CPS chunk actor (kept aligned with the Flow-CPS actor).
  horizon: 4
  actor_hidden_dims: [512, 256, 128]
  activation: elu
  flow_steps: 4
  # Aggregate RMS in normalized-action units after the fixed decoder response
  # metric (frame delta, d2, and carried terminal-rate tail).  This is an
  # absolute physical budget, not a fraction of the very large target-rate
  # support.
  cps_physical_rms: 0.05
  cps_trainable: true
  rollout_env_steps: 24
  discount_gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  desired_kl: 0.01
  policy_epochs: 5
  num_mini_batches: 4
  micro_batch_size: 4096
  policy_lr: 0.0003
  value_lr: 0.0003
  weight_decay: 0.0
  critic_weight_decay: 0.0
  empirical_normalization: true
  init_at_random_ep_len: true
  max_grad_norm: 1.0
  # A tentative actor step is committed only when every frame's exact expected
  # conditional KL is at most this multiple of desired_kl.
  kl_acceptance_factor: 4.0
  style_prior:
    enabled: true
    # 16 states at 50 Hz span 0.30 s (15 transitions).
    obs_steps: 16
    hidden_dims: [1024, 512]
    reward_scale: 2.0
    reward_epsilon: 0.0001
    optimizer: sgd
    learning_rate: 0.00025
    weight_decay: 0.0001
    epochs: 2
    # Absolute batch size; deliberately independent of num_envs for GP memory.
    batch_size: 1024
    current_buffer_size: 65536
    replay_size: 200000
    replay_samples: 1000
    replay_dtype: float32
    replay_device: cpu
    grad_penalty: 10.0
    logit_reg: 0.01
    normalizer_clip: 10.0
    reward_eval_batch_size: 4096
    max_updates_per_iteration: 32
    # Train the discriminator once on a discarded rollout before actor update 1.
    discriminator_warmup_rollouts: 1

  credit:
    mode: causal_frame
    task_weight: 1.0
    amp_weight: 1.0
    # Current handcrafted task reward is already multiplied by dt.
    integrate_amp_reward_dt: true
    # Form the weighted task/style advantage first, then normalize that single
    # scalar objective once over the fixed 10/90 training measure.
    advantage_normalization: global
    ratio_mode: conditional_frame

  critics:
    encoder_hidden_dims: [512, 256, 128]
    head_hidden_dims: [128, 64]
    sharing: encoder
    task_loss_weight: 1.0
    amp_loss_weight: 1.0

  # Ten percent of the interaction/optimizer budget persistently attempts full
  # episodes from phase 0.  A trajectory is counted complete only when the
  # environment emits motion_complete; reset-at-zero is never called success.
  streams:
    phase0_fraction: 0.10

training:
  seed: 0
  max_updates: 500
  log_every: 10
  save_every: 50
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 50
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: 0
  target_validation_steps: 0
