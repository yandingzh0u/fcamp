# Single source of truth for the MixGRPO crawl task.
#
# There is exactly ONE place a default lives: here. train.py reads this file, applies any
# `--set a.b=c` overrides, and builds the typed configs. No argparse defaults, no dataclass
# defaults shadowing each other, no env-config getattr copies. Change a value here (or via
# --set) and it takes effect, period.
#
# Sections:
#   env   -> environment / task / reward / termination (EnvCfg)
#   algo  -> algorithm + network + optimization (mixgrpo) (AlgoCfg)
#   train -> training loop / io / validation (TrainCfg)

algo_name: mixgrpo

env:
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  fix_root_link: false
  startup_randomization: true
  action_scale_multiplier: 1.0
  motion_file: ""          # "" resolves to the packaged crawl motion
  max_episode_steps: -1    # <=0 follows the motion clip length
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  # adaptive phase sampling
  adaptive_motion_sampling: true
  adaptive_uniform_ratio: 0.1
  motion_start_phase_ratio: 0.25
  adaptive_alpha: 0.001
  adaptive_kernel_size: 1
  # reward weights
  joint_acc_weight: 2.5e-7
  joint_torque_weight: 1.0e-5
  action_rate_weight: 0.1
  action_accel_weight: 0.0
  action_l2_weight: 0.0
  term_z_weight: 3.0
  term_z_sigma: 0.12

algo:
  # network
  action_dim: 29
  horizon: 12
  actor_hidden_dims: [512, 256, 128]
  activation: elu
  action_squash_scale: 5.0
  # flow / SDE exploration
  flow_steps: 4
  sde_eta: 0.7
  init_noise_std: 0.8
  init_same_noise: false
  first_generation_zero_noise: false
  eval_initial_noise: zero
  num_generations: 4
  # rollout
  rollout_env_steps: 48      # effective chunks = rollout_env_steps // horizon
  chunks_per_rollout: 24     # fallback when rollout_env_steps <= 0
  tail_bootstrap_steps: 80
  terminal_penalty: 50.0
  discount_gamma: 0.99
  # on-policy state bank
  onpolicy_state_bank: false
  onpolicy_state_ratio: 0.5
  onpolicy_refresh_every: 25
  onpolicy_bank_rollout_steps: 0
  onpolicy_bank_min_phase: 80
  onpolicy_bank_capacity: 16384
  onpolicy_bank_min_size: 256
  onpolicy_bank_hard_ratio: 0.5
  onpolicy_bank_hard_window: 96
  # optimization
  clip_range: 0.3
  adv_clip_max: 5.0
  desired_kl: 0.06
  entropy_coef: 0.005
  policy_epochs: 5
  num_mini_batches: 4
  micro_batch_size: 8192
  max_grad_norm: 1.0
  policy_lr: 1.0e-3

train:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 500
  checkpoint_dir: ""
  resume: ""
  reset_optimizer_on_resume: false
  validation_every: 0
  validation_max_steps: 500
  validation_start_phase: 0
  validation_fixed_seed: -1
  validation_preserve_state: true
  validation_observation_noise: false
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
  success_checkpoint_name: success_10s.pt
  debug_probe: false
  debug_probe_every: 1
