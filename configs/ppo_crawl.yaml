# PPO on the G1 crawl task. Actor-critic + GAE PPO ported from holosoma's PPO core.
# Values follow holosoma's WBT crawl experiment (num_learning_epochs=5, lr=1e-3,
# entropy_coef=0.005, init_noise_std=1.0, empirical_normalization, use_symmetry off).
#
# Single source of defaults. Override any leaf with --set a.b=c.

algo_name: ppo

env:
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  fix_root_link: false
  startup_randomization: true
  motion_file: ""
  max_episode_steps: 500        # official 10s @ 50Hz
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  # adaptive phase sampling (Holosoma death-frame binning, owned by env.step)
  adaptive_motion_sampling: true
  adaptive_uniform_ratio: 0.1
  adaptive_alpha: 0.001
  adaptive_kernel_size: 1
  # reward: official Holosoma WBT 9-term reward. action_rate is the only tunable weight.
  action_rate_weight: 0.1

algo:
  action_dim: 29
  horizon: 1                 # PPO single-step actions
  actor_hidden_dims: [512, 256, 128]
  activation: elu
  num_generations: 1         # PPO has no GRPO groups
  discount_gamma: 0.99
  # PPO-specific
  num_steps_per_env: 24
  num_learning_epochs: 5
  num_mini_batches: 4
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coef: 0.005
  value_loss_coef: 1.0
  desired_kl: 0.01
  actor_learning_rate: 1.0e-3
  critic_learning_rate: 1.0e-3
  weight_decay: 0.0
  init_noise_std: 1.0
  empirical_normalization: true
  init_at_random_ep_len: true
  max_grad_norm: 1.0

train:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 100
  checkpoint_dir: ""
  resume: ""
  reset_optimizer_on_resume: false
  validation_every: 0
  validation_max_steps: 500
  validation_start_phase: 0
  validation_fixed_seed: -1
  validation_preserve_state: true
  validation_observation_noise: false
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
  success_checkpoint_name: success_10s.pt
  debug_probe: false
  debug_probe_every: 1
