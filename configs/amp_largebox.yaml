method: amp
environment:
  platform_profile: g1_largebox_50hz
  task: largebox_plane
  device: cuda:0
  num_envs: 4096
  # The motion file is native 50 fps, so control remains 50 Hz while physics
  # runs at 200 Hz.  This preserves the clip's 324-transition timing.
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  root_velocity_mode: link

parameters:
  # MimicKit actor: direct normalized absolute action Gaussian. H=1 is the
  # exact AMP baseline; H can be overridden (for example to 4).
  horizon: 1
  actor_hidden_dims: [1024, 512]

  rollout_env_steps: 32
  discount_gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  advantage_clip: 4.0
  policy_epochs: 5
  critic_epochs: 2
  # Official values are multiples of num_envs: actor logical batch=4*N,
  # critic logical batch=2*N. Micro batches only accumulate an equivalent
  # gradient and do not add optimizer steps.
  actor_batch_size: 4
  critic_batch_size: 2
  micro_batch_size: 4096
  policy_lr: 0.0001
  value_lr: 0.0001
  action_bound_weight: 10.0

  style_prior:
    # Official AMP uses ten chronological states. At the native 50 Hz motion
    # rate this is 0.18 s between first and final state.
    obs_steps: 10
    hidden_dims: [1024, 512]
    reward_scale: 2.0
    reward_epsilon: 0.0001
    learning_rate: 0.00025
    weight_decay: 0.0001
    epochs: 2
    # Official logical batch B=2*num_envs. Each update compares B current,
    # B replay, and B expert windows; micro batches are gradient accumulation.
    batch_size: 2
    micro_batch_size: 1024
    replay_size: 200000
    # Once the global ring is full, insert an independently uniform subset of
    # at most 1000 current windows. Before it is full, insert all windows.
    replay_samples: 1000
    grad_penalty: 10.0
    logit_reg: 0.01
    normalizer_clip: 10.0
    reward_eval_batch_size: 4096

  critic:
    hidden_dims: [1024, 512]

training:
  seed: 0
  max_updates: 500
  log_every: 10
  save_every: 50
  resume: ""
  reset_optimizer_on_resume: false
  validation_every: 50
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: 0
  target_validation_steps: 0
