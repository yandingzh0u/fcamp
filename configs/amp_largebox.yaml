method: amp
environment:
  task: largebox_plane
  device: cuda:0
  num_envs: 4096
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: false
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: false
  interval_pushes: false
  observation_noise: false
  reset_phase_sampling: uniform
  rsi_keyframe_count: 21
  adaptive_motion_sampling: false
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1

parameters:
  # Mirrors MimicKit data/agents/amp_g1_agent.yaml while keeping this repo's
  # G1 assets, action space, task, and reward implementation.
  actor_hidden_dims: [1024, 512]
  critic_hidden_dims: [1024, 512]
  disc_hidden_dims: [1024, 512]
  activation: relu
  rollout_env_steps: 32
  discount_gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  norm_adv_clip: 4.0

  actor_epochs: 5
  actor_batch_size: 4
  critic_epochs: 2
  critic_batch_size: 2
  disc_epochs: 2
  disc_batch_size: 2

  actor_lr: 0.0001
  critic_lr: 0.0001
  disc_lr: 0.00025
  disc_weight_decay: 0.0001
  actor_init_output_scale: 0.01
  action_std: 0.05
  action_bound_weight: 10.0
  action_entropy_weight: 0.0
  action_reg_weight: 0.0

  task_reward_weight: 0.0
  disc_reward_weight: 1.0
  disc_reward_scale: 2.0
  disc_reward_epsilon: 0.0001
  disc_buffer_size: 200000
  disc_replay_samples: 1000
  disc_logit_reg: 0.01
  disc_grad_penalty: 10.0
  disc_obs_steps: 10
  disc_normalizer_clip: 10.0
  disc_eval_batch_size: 8192

  empirical_normalization: true
  init_at_random_ep_len: false

training:
  seed: 1
  max_updates: 500
  log_every: 10
  save_every: 50
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 50
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: 1
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
