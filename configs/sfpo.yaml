algorithm: sfpo
environment:
  task: largebox_plane
  device: cuda:0
  num_envs: 8192
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
parameters:
  horizon: 4
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  action_squash_scale: 5.0
  flow_steps: 4
  sde_eta: 0.7
  init_noise_std: 0.8
  eval_initial_noise: zero
  rollout_env_steps: 24
  discount_gamma: 0.99
  clip_range: 0.2
  desired_kl: 0.01
  policy_epochs: 5
  num_mini_batches: 4
  micro_batch_size: 8192
  value_loss_coef: 1.0
  value_clip_range: 0.2
  use_clipped_value_loss: true
  policy_lr: 0.0003
  value_lr: 0.0003
  weight_decay: 0.0
  critic_weight_decay: 0.0
  empirical_normalization: true
  init_at_random_ep_len: true
  max_grad_norm: 1.0
  # action-conditioned multi-horizon actor-critic
  # failure_value = -failure_penalty; injected as the absorbing-state bootstrap
  # at the failure frame so early death can never outrank survival by skipping
  # negative future reward. Tune up if death chunks still rank too high.
  failure_penalty: 10.0
  # weight of the per-prefix Q critic loss
  q_loss_coef: 1.0
  # clip Q_k around its collect-time value (PPO-style value clipping for Q)
  q_value_clip_range: 0.2
  use_clipped_q_loss: true
  # advantage normalization mode: per_prefix | global | none
  advantage_normalization: per_prefix
training:
  seed: 0
  max_updates: 1000
  log_every: 1
  save_every: 100
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 100
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: -1
  validation_done_frac_early_stop: 0.98
  target_validation_steps: 0
