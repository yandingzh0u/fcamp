method: beyondmimic
environment:
  platform_profile: g1_largebox_50hz
  task: largebox_plane
  device: cuda:0
  num_envs: 4096
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  reset_phase_sampling: beyondmimic
  rsi_keyframe_count: 21
  adaptive_motion_sampling: true
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  adaptive_uniform_ratio: 0.1
  adaptive_kernel_size: 1
  adaptive_lambda: 0.8
  action_rate_weight: 0.1
  termination_mode: beyondmimic
  terminate_on_motion_end: false
  motion_reference_mode: frame
  root_velocity_mode: com
  policy_observation_mode: beyondmimic
  motion_end_behavior: resample_command
  physics_material_combine_mode: multiply
  contact_sensor_update_period: physics

parameters:
  # HybridRobotics/whole_body_tracking, commit cd651720.
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: elu
  rollout_env_steps: 24
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.005
  learning_rate: 0.001
  max_grad_norm: 1.0
  use_clipped_value_loss: true
  schedule: adaptive
  desired_kl: 0.01
  empirical_normalization: true
  init_at_random_ep_len: true
  init_noise_std: 1.0
  noise_std_type: scalar
  state_dependent_std: false
  normalize_advantage_per_mini_batch: false

training:
  seed: 1
  max_updates: 30000
  log_every: 10
  save_every: 500
  official_reset_every: 0
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 50
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: 1
  target_validation_steps: 0
