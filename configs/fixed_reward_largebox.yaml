method: fixed_reward
environment:
  platform_profile: g1_largebox_50hz
  task: largebox_plane
  device: cuda:0
  num_envs: 4096
  sim_dt: 0.02
  decimation: 4
  fix_root_link: false
  startup_randomization: true
  max_episode_steps: 500
  motion_start_phase: 0
  motion_end_phase: -1
  reset_noise: true
  interval_pushes: true
  observation_noise: true
  reset_phase_sampling: adaptive
  rsi_keyframe_count: 21
  adaptive_num_bins: 0
  adaptive_alpha: 0.001
  adaptive_predecessor_ratio: 0.8
  adaptive_predecessor_lookback_bins: 1
  action_rate_weight: 0.1
  root_velocity_mode: link

parameters:
  actor_hidden_dims: [512, 256, 128]
  critic_hidden_dims: [512, 256, 128]
  activation: ELU
  action_clip_value: 100.0
  num_steps_per_env: 24
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.005
  actor_learning_rate: 0.001
  critic_learning_rate: 0.001
  actor_weight_decay: 0.0
  critic_weight_decay: 0.0
  max_grad_norm: 1.0
  schedule: adaptive
  desired_kl: 0.01
  init_noise_std: 1.0
  init_at_random_ep_len: true
  empirical_normalization: true
  use_symmetry: false
  phase0_fraction: 0.10

training:
  seed: 42
  max_updates: 500
  log_every: 1
  save_every: 4000
  resume: ""
  reset_optimizer_on_resume: false
  reset_sampler_on_resume: false
  validation_every: 50
  validation_max_steps: 500
  validation_start_phase: 0
  validation_directional_start_phase: -1
  validation_fixed_seed: 0
  target_validation_steps: 0
